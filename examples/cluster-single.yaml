# Ví dụ cấu hình cụm 1 Control Plane + 1 Worker (phù hợp môi trường lab ARM64/AMD64)
apiVersion: vkube.io/v1alpha1
kind: Cluster
metadata:
  name: vkube-single
spec:
  arch: arm64
  networking:
    podSubnet: 10.244.0.0/16
    serviceSubnet: 10.96.0.0/12
    cni: calico
  ssh:
    user: ubuntu
    port: 22
    privateKeyPath: ~/.ssh/id_ed25519
  nodes:
    - name: cp-1
      host: 192.0.2.10
      role: control-plane
    - name: worker-1
      host: 192.0.2.11
      role: worker
