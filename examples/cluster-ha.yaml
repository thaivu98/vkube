# Ví dụ cấu hình cụm HA 3 Control Planes + 2 Workers dùng kube-vip (On-premise / Air-gapped)
apiVersion: vkube.io/v1alpha1
kind: Cluster
metadata:
  name: vkube-ha-prod
spec:
  arch: amd64
  vip: 192.0.2.100
  # vipInterface: ens160  # Tùy chọn; bỏ trống để vkube tự phát hiện card mạng mặc định
  networking:
    podSubnet: 10.244.0.0/16
    serviceSubnet: 10.96.0.0/12
    cni: calico
  ssh:
    user: ubuntu
    port: 22
    privateKeyPath: ~/.ssh/id_ed25519
  nodes:
    - name: cp-1
      host: 192.0.2.11
      role: control-plane
    - name: cp-2
      host: 192.0.2.12
      role: control-plane
    - name: cp-3
      host: 192.0.2.13
      role: control-plane
    - name: worker-1
      host: 192.0.2.21
      role: worker
    - name: worker-2
      host: 192.0.2.22
      role: worker
