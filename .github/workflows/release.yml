name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Multi-arch Binaries & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test -race ./...

      - name: Cross-compile all 6 platforms
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          make release-all VERSION="${VERSION}"
          cd dist
          sha256sum vkube-* > SHA256SUMS
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/vkube-*
            dist/SHA256SUMS
